<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY | Absensi</title><style>
:root{--bg:#eef2f6;--card:#fff;--ink:#111827;--muted:#64748b;--accent:#ffc107;--green:#16a34a;--red:#dc2626;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.fx-top{background:#111827;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.fx-top strong{font-size:17px}.fx-top .grow{flex:1}.fx-wrap{max-width:1000px;margin:auto;padding:18px}.fx-card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink)}.fx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fx-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;min-height:42px;padding:9px 10px;border:2px solid var(--ink);border-radius:9px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:90px}button,.fx-btn{border:0;border-radius:9px;padding:10px 13px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.fx-btn.green{background:var(--green)}.fx-btn.blue{background:var(--blue)}.fx-btn.red{background:var(--red)}.fx-btn.light{background:#e5e7eb;color:var(--ink)}.fx-table{width:100%;border-collapse:collapse;font-size:12px}.fx-table th,.fx-table td{padding:9px;border-bottom:1px solid #dbe2ea;text-align:left}.fx-table th{background:#f8fafc}.fx-badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#e5e7eb;font-size:10px;font-weight:900}.fx-msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:#111827;color:#fff;padding:13px 16px;border-radius:11px;z-index:99;transition:.2s;max-width:90%;box-shadow:4px 4px 0 #000}.fx-msg.show{transform:translateX(-50%) translateY(0)}.fx-msg[data-type=error]{background:#b91c1c}.fx-msg[data-type=success]{background:#15803d}.fx-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fx-menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#fff;color:#111827;border:2px solid #111827;box-shadow:2px 2px 0 #111827}.fx-menu button.locked{opacity:.48}.fx-menu small{color:#64748b}@media(max-width:700px){.fx-grid,.fx-grid3,.fx-menu{grid-template-columns:1fr}.fx-wrap{padding:12px}.fx-top{padding:11px 12px}}</style>
<div id="fxMsg" class="fx-msg"></div>
</head><body><header class="fx-top"><strong>Absensi</strong><div class="grow"></div><span data-fx-role></span><button onclick="location.href='index.html'">Menu</button></header><main class="fx-wrap"><section class="fx-card"><h2>Absensi</h2><form id="f"><label>Status</label><select id="status"><option value="masuk">Masuk</option><option value="pulang">Pulang</option></select><button class="fx-btn blue" style="margin-top:12px">Catat</button></form></section><section class="fx-card"><div id="list">Memuat...</div></section></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut,signInWithEmailAndPassword,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,getDocs,serverTimestamp,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
const BUSINESS_PERMISSIONS={servis:"Input Servis",penjualan:"Input Penjualan",pengeluaran:"Pengeluaran",dataServis:"Data Servis",dataPenjualan:"Data Penjualan",stock:"Stok Produk",laporanKeuangan:"Laporan Keuangan",dashboard:"Dashboard",absensi:"Absensi",dataKaryawan:"Data Karyawan",izinAkses:"Izin Akses",saldoToken:"Saldo Token",cekPaket:"Cek Paket"};
const PAGE_PERMISSION={"servisan.html":"servis","penjualan.html":"penjualan","pengeluaran.html":"pengeluaran","data-servis.html":"dataServis","data-penjualan.html":"dataPenjualan","stock.html":"stock","tampil-stock.html":"stock","ringkasan-pendapatan.html":"laporanKeuangan","dashboard-admin.html":"dashboard","absensi-karyawan.html":"absensi","data-karyawan.html":"dataKaryawan","izin-akses.html":"izinAkses","saldo-token.html":"saldoToken","cek-paket.html":"cekPaket","token-registrasi.html":"superadmin","token-perpanjangan.html":"superadmin","token-reseller.html":"superadmin","request-saldo.html":"superadmin","daftar-pengguna.html":"superadmin","pengaturan.html":"izinAkses"};
window.fixzy={auth,db,session:null,BUSINESS_PERMISSIONS,PAGE_PERMISSION};
function normalizePerm(v){if(Array.isArray(v)){const o={};v.forEach(k=>o[k]=true);return o;}return v&&typeof v==='object'?v:{};}
async function buildSession(user){
  const s=await getDoc(doc(db,'users',user.uid)); if(!s.exists()) throw new Error('Profil akun tidak ditemukan.');
  const p=s.data()||{}; const role=String(p.role||'').trim().toLowerCase();
  if(!['superadmin','owner','karyawan'].includes(role)) throw new Error('Role akun tidak valid.');
  let ownerUid='';
  if(role==='karyawan') ownerUid=String(p.ownerUid||'').trim(); else ownerUid=user.uid;
  if(!ownerUid) throw new Error('Karyawan belum terhubung ke Owner.');
  const permissions=normalizePerm(p.permissions??p.izin??p.hakAkses??p.access);
  const session={uid:user.uid,email:user.email||'',role,ownerUid,profile:p,permissions};
  window.fixzy.session=session; return session;
}
window.fixzy.requireAuth=async function(){
  const u=auth.currentUser; if(!u){location.replace('login.html');return null;}
  try{return await buildSession(u);}catch(e){console.error(e);await signOut(auth);location.replace('login.html');return null;}
};
window.fixzy.hasPermission=function(key){const s=window.fixzy.session;if(!s)return false;if(s.role==='superadmin')return true;if(key==='superadmin')return false;return s.permissions?.[key]===true||s.permissions?.all===true||s.permissions?.semua===true;};
window.fixzy.canOpenPage=function(page){const s=window.fixzy.session;if(!s)return false;const key=PAGE_PERMISSION[page]||'';if(s.role==='superadmin')return true;if(key==='superadmin')return false;if(s.role==='owner')return window.fixzy.hasPermission(key);if(s.role==='karyawan')return window.fixzy.hasPermission(key);return false;};
window.fixzy.scope=function(extra={}){const s=window.fixzy.session;if(!s)throw new Error('Sesi belum siap.');return {...extra,ownerUid:s.ownerUid,createdByUid:s.uid,createdByName:String(s.profile.nama||s.profile.namaKaryawan||s.profile.namaTeknisi||s.profile.displayName||s.email||'').trim(),createdByRole:s.role};};
window.fixzy.qScope=function(col,field='ownerUid'){const s=window.fixzy.session;if(!s)throw new Error('Sesi belum siap.');return query(collection(db,col),where(field,'==',s.ownerUid));};
window.fixzy.rp=v=>'Rp '+Number(v||0).toLocaleString('id-ID');
window.fixzy.esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
window.fixzy.msg=function(message,type='info'){const box=document.getElementById('fxMsg');if(!box){alert(message);return;}box.textContent=message;box.dataset.type=type;box.classList.add('show');setTimeout(()=>box.classList.remove('show'),4000);};
window.fixzy.logout=async()=>{await signOut(auth);location.replace('login.html');};
window.fixzy.renderIdentity=function(){const s=window.fixzy.session;if(!s)return;document.querySelectorAll('[data-fx-role]').forEach(x=>x.textContent=s.role.toUpperCase());document.querySelectorAll('[data-fx-email]').forEach(x=>x.textContent=s.email);document.querySelectorAll('[data-fx-owner]').forEach(x=>x.textContent=s.ownerUid);document.querySelectorAll('[data-fx-name]').forEach(x=>x.textContent=s.profile.namaKonter||s.profile.namaUsaha||s.profile.nama||s.email);};
window.fixzy.guard=function(page){if(!window.fixzy.canOpenPage(page)){document.body.innerHTML='<main class="fx-wrap"><section class="fx-card"><h2>🔒 Akses Ditolak</h2><p>Menu ini belum diberikan kepada akun ini.</p><button onclick="history.back()">Kembali</button></section></main>';return false;}return true;};
onAuthStateChanged(auth,async user=>{if(!user){if(!location.pathname.endsWith('/login.html')&&!location.pathname.endsWith('register.html'))location.replace('login.html');return;}try{await buildSession(user);window.fixzy.renderIdentity();window.dispatchEvent(new CustomEvent('fixzy-ready'));}catch(e){console.error(e);await signOut(auth);location.replace('login.html');}});
</script>
<script type="module">async function load(){const s=await getDocs(fixzy.qScope('absensi'));list.innerHTML=s.docs.slice(-50).reverse().map(d=>{const x=d.data();return `<div style="padding:8px;border-bottom:1px solid #ddd">${fixzy.esc(x.tanggal||'')} — ${fixzy.esc(x.status||'')} — ${fixzy.esc(x.createdByName||'')}</div>`}).join('')||'Belum ada absensi.'}window.addEventListener('fixzy-ready',async()=>{if(!fixzy.guard('absensi-karyawan.html'))return;await load();f.onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'absensi'),fixzy.scope({tanggal:new Date().toISOString(),status:status.value}));fixzy.msg('Absensi dicatat.','success');await load()}});</script><script type="module">window.addEventListener('fixzy-ready',()=>{window.fixzy.renderIdentity();window.fixzy.guard('absensi-karyawan.html')});</script></body></html>
