.item-grid{display:grid;grid-template-columns:minmax(0,1.5fr) 100px 120px;gap:8px;align-items:end;margin-top:8px}.item-grid input,.item-grid select{box-shadow:none}.product-select{min-width:0}.product-search{margin-bottom:6px!important;box-shadow:none!important}.qty-label{font-size:10px;color:#64748b;font-weight:800;margin-bottom:4px}
.summary{margin-top:10px;border:2px solid #111827;border-radius:9px;padding:10px;background:#fffbeb;font-size:12px;line-height:1.8}.summary b{font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.primary{background:#111827;color:#fff}.approve{background:#16a34a;color:#fff}.reject{background:#fee2e2;color:#991b1b}.wa{background:#22c55e;color:#fff}.secondary{background:#e5e7eb}
.add-product{background:#ffc107;color:#111827}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:none;align-items:center;justify-content:center;padding:14px}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);background:#fff;border:2px solid #111827;border-radius:12px;padding:15px;box-shadow:5px 5px 0 #111827}.modal-title{font-size:16px;font-weight:900;margin-bottom:12px}.modal-grid{display:grid;grid-template-columns:1fr 110px;gap:10px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.modal-actions .btn{min-width:110px}.empty{text-align:center;padding:28px;color:#64748b;font-size:12px}
body.dark{background:#0b1220;color:#e5e7eb}body.dark .card,body.dark .order,body.dark .item{background:#111827;color:#e5e7eb;border-color:#475569}body.dark .order-head{background:#0f172a;border-color:#475569}body.dark .title{border-color:#475569}body.dark label{color:#9ca3af}body.dark input,body.dark select{background:#0f172a;color:#fff;border-color:#475569}body.dark .summary{background:#1c1917;border-color:#475569}body.dark .meta b{color:#fff}body.dark .stockline{color:#94a3b8}
@media(max-width:800px){.filters{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr 100px}.item-grid>div:first-child{grid-column:1/-1}}
@media(max-width:650px){header{height:68px}.head h1{font-size:16px}main{padding-top:80px}.refresh{padding:8px}.order-head{flex-direction:column}.actions .btn{flex:1;min-width:120px}}

<body>
<header><div class="head">
<img class="logo" src="logo.png" alt="FIXZY">
<div class="hi"><h1>Approval Order</h1><span id="email" class="email">-</span></div>
<div class="acts"><button class="btn refresh" onclick="location.reload()">↻ Refresh</button><button id="dark" class="btn dark">🌙</button></div>
</div></header>
<div id="addProductModal" class="modal-backdrop"><div class="modal"><div class="modal-title">➕ Tambah Produk ke Pesanan</div><div class="notice">Produk tambahan disimpan ke <b>penjualan.items</b>. Status tetap Menunggu Approval dan stok Spreadsheet belum diubah.</div><label>PRODUK</label><input id="addProductSearch" class="product-search" type="search" placeholder="Cari nama / kode / brand..."><select id="addProductSelect"><option value="">-- pilih produk --</option></select><div class="modal-grid" style="margin-top:10px"><div><label>QTY</label><input id="addProductQty" type="number" min="1" value="1"></div><div><label>HARGA/PCS</label><input id="addProductPrice" type="number" min="0" value="0"></div></div><div id="addProductInfo" class="stockline" style="margin-top:8px"></div><div class="modal-actions"><button class="btn secondary" type="button" onclick="closeAddProduct()">Batal</button><button class="btn add-product" type="button" onclick="saveAddedProduct()">💾 Tambahkan</button></div></div></div><main>

<div class="card"><div class="title">Klarifikasi Pesanan</div>
<div class="filters">
<div><label>CARI NOTA / KARYAWAN / KODE</label><input id="search" placeholder="Ketik pencarian..."></div>
<div><label>STATUS</label><div style="font-size:11px;font-weight:900;color:#15803d;padding:11px 0">Menunggu Approval</div></div>
<div><label>CATATAN</label><div style="font-size:11px;color:#64748b;line-height:1.6;padding-top:7px">Periksa stok aktual. Hanya qty yang disetujui yang dipindahkan ke <b>order_member</b>.</div></div>
</div></div>
<div id="list"></div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,getDoc,doc,runTransaction,serverTimestamp,addDoc,increment}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let uid="",ownerUid="",profile={},role="",rows=[],ready=false,stockCatalog=[];
const $=id=>document.getElementById(id),rp=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const waNum=v=>{let s=String(v||"").replace(/\D/g,"");if(s.startsWith("0"))s="62"+s.slice(1);else if(s.startsWith("8"))s="62"+s;else if(!s.startsWith("62"))s="62"+s;return s};
const today=()=>new Date().toISOString().slice(0,10);
function msg(t,c=""){$("notice").textContent=t;$("notice").className="notice "+c}
function getOwner(d){let r=String(d.role||"").toLowerCase();if(r==="owner"||r==="superadmin")return uid;return String(d.ownerUid||d.ownerId||"").trim()||uid}
function itemName(x){return String(x.nama||x.namaProduk||x.kode||x.kodeProduk||"-")}
function stockName(x){return String(x.nama||x.namaProduk||x.namaBarang||x.kode||x.kodeProduk||"-")}
function stockCode(x){return String(x.kode||x.kodeProduk||x.kodeBarang||"")}
function stockPrice(x){return Number(x.hargaJual??x.harga??x.hargaTempo??x.hargaCash??x.jual??0)||0}
function stockModal(x){return Number(x.modalSatuan??x.modal??x.hargaModal??0)||0}
function activeSheetPrice(x,r){return isCash(r)?Number(x.modal??x.hargaCash??x.modalSatuan??0)||0:Number(x.jual??x.hargaTempo??x.hargaJual??x.harga??0)||0}
function productOptions(selectedId){
 const list=stockCatalog.filter(x=>String(x.ownerUid||x.ownerId||"")===ownerUid);
 return `<option value="">-- pilih / ganti produk --</option>`+list.map(x=>{const id=String(x.id||""),label=`${stockName(x)}${stockCode(x)?` • ${stockCode(x)}`:""}${stockPrice(x)?` • ${rp(stockPrice(x))}`:""};return `<option value="${esc(id)}" ${id===String(selectedId||"")?"selected":""}>${esc(label)}</option>`}).join("");
}
function normalizeItems(r){
 const a=Array.isArray(r.items)?r.items:Array.isArray(r.produkList)?r.produkList:[];
 return a.map(x=>({...x,nama:itemName(x),produkId:x.produkId||x.id||"",kode:x.kode||x.kodeProduk||"",qty:Number(x.qty||x.jumlah||1),harga:Number(x.harga??x.hargaJual??0)||0,hargaDasar:Number(x.hargaDasar??0)||0,hargaTempo:Number(x.hargaTempo??0)||0,hargaCash:Number(x.hargaCash??0)||0,diskon:Number(x.diskon??x.discount??0)||0,modalSatuan:Number(x.modalSatuan??x.modal??0)||0,approvedQty:Number(x.approvedQty??0)||0,stokTersedia:Number(x.stokTersedia??0)||0,tabunganPerPcs:Number(x.tabunganPerPcs??0)||0,upPengelolaPerPcs:Number(x.upPengelolaPerPcs??0)||0}))
}
function member(r){return r.pelanggan||r.member||{}}
function status(r){return String(r.status||"menunggu_approval").toLowerCase()}
function isCash(r){return String(r.jenisHarga||"").toLowerCase()==="cash"||String(r.tipeTransaksi||"").toLowerCase()==="order_cash"}
function clean(s){return String(s??"").trim().toLowerCase().replace(/[\s_\-()./]+/g,"")}
function numVal(v){let x=String(v??"").trim();if(!x)return 0;x=x.replace(/[^\d,.-]/g,"");const comma=x.includes(","),dot=x.includes(".");if(comma&&dot){if(x.lastIndexOf(",")>x.lastIndexOf("."))x=x.replace(/\./g,"").replace(",",".");else x=x.replace(/,/g,"")}else if(comma)x=x.replace(",",".");else if(dot){const a=x.split(".");x=a.length===2&&a[1].length<=2?x:x.replace(/\./g,"")}const n=parseFloat(x);return Number.isFinite(n)?n:0}
function pick(o,keys){for(const k of keys){const v=o[clean(k)];if(v!==undefined&&String(v).trim()!=="")return v}return""}
function parseCSV(text){const out=[];let row=[],cell="",q=false;text=text.replace(/^\uFEFF/,"");for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===","&&!q){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!q){if(c==="\r"&&n==="\n")i++;row.push(cell);cell="";if(row.some(v=>String(v).trim()))out.push(row);row=[]}else cell+=c}if(cell!==""||row.length){row.push(cell);if(row.some(v=>String(v).trim()))out.push(row)}return out}
function normalizeSheet(rows,sourceIndex,sourceUrl){
 if(!rows.length)throw Error("Spreadsheet kosong.");const h=rows[0].map(clean),data=[];
 for(let i=1;i<rows.length;i++){const r=rows[i],o={};h.forEach((k,j)=>o[k]=r[j]??"");const nama=pick(o,["nama barang","nama produk","nama","produk","product","barang"]);if(!nama)continue;const modalValue=pick(o,["modal","harga modal","harga beli","harga modal produk","hpp","harga pokok"]),jualValue=pick(o,["jual","harga jual","harga jual produk","harga penjualan"]),supplier=pick(o,["supplier","suplier","nama supplier","nama suplier","vendor"]),stokValue=pick(o,["stock","stok","sisa stok","sisa","jumlah stok"]),kode=pick(o,["kode","sku","kode produk","id"])||String(r[0]??"").trim();const id=`sheet${sourceIndex}_${i}_${btoa(unescape(encodeURIComponent(String(sourceUrl)))).replace(/[^a-zA-Z0-9]/g,"").slice(0,10)}`;data.push({id,kode:String(kode||"").trim(),nama:String(nama).trim(),namaProduk:String(nama).trim(),supplier:String(supplier||`Supplier ${sourceIndex}`).trim(),modal:numVal(modalValue!==""?modalValue:(r[3]??"")),jual:numVal(jualValue!==""?jualValue:(r[4]??"")),stok:Math.max(0,numVal(stokValue!==""?stokValue:(r[6]??""))),ownerUid,sourceIndex,sourceSpreadsheet:sourceUrl})}return data
}
function csvUrlFromSheet(url){const u=new URL(url),host=u.hostname.toLowerCase();if(!host.includes("docs.google.com")||!u.pathname.includes("/spreadsheets/"))return url;const gid=u.searchParams.get("gid")||"0";const pub=u.pathname.match(/\/spreadsheets\/d\/e\/([^/]+)\/pub(?:html)?/i);if(pub)return`https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?gid=${encodeURIComponent(gid)}&single=true&output=csv`;const id=u.pathname.match(/\/spreadsheets\/d\/([^/]+)/i);if(id)return`https://docs.google.com/spreadsheets/d/${id[1]}/export?format=csv&gid=${encodeURIComponent(gid)}`;return url}
async function getSavedLinks(){const snap=await getDoc(doc(db,"pengaturan_spreadsheet",ownerUid));if(!snap.exists())return[];const d=snap.data()||{};let links=Array.isArray(d.spreadsheetLinks)?d.spreadsheetLinks.map(x=>String(x||"").trim()).filter(Boolean):[];if(!links.length&&d.spreadsheetUrl)links=[String(d.spreadsheetUrl).trim()];return[...new Set(links)]}
async function loadStockCatalog(){
 stockCatalog=[];if(!ownerUid)return;
 try{const links=await getSavedLinks();if(!links.length){msg("Link Spreadsheet Owner belum tersedia.","err");return}const all=[],errors=[];
 for(let i=0;i<links.length;i++){try{const res=await fetch(csvUrlFromSheet(links[i]),{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const text=await res.text();if(/<html|<!doctype/i.test(text.slice(0,500)))throw Error("Bukan CSV / belum Publish to web");all.push(...normalizeSheet(parseCSV(text),i+1,links[i]))}catch(e){errors.push(`Spreadsheet ${i+1}: ${e.message}`)}}
 stockCatalog=all;if(errors.length)console.warn("Spreadsheet:",errors)
 }catch(e){console.error(e);msg("Gagal memuat Spreadsheet: "+(e.message||e),"err")}
}
async function load(){
  rows=[];
  stockCatalog=[];
  if(!ownerUid)return;

  msg("Memuat data pesanan dan katalog stok...");

  // Katalog harus dimuat sebelum render agar pilihan produk/harga bisa tampil.
  await loadStockCatalog();

  const qs=[
   query(collection(db,"penjualan"),where("ownerUid","==",ownerUid),where("status","==","menunggu_approval")),
   query(collection(db,"penjualan"),where("ownerId","==",ownerUid),where("status","==","menunggu_approval"))
  ];
  const map=new Map();
  for(const q of qs){
    const snap=await getDocs(q);
    snap.forEach(d=>{
      const x={id:d.id,...d.data()};
      const spreadsheetOrder=x.sumber==="order_spreadsheet"||x.tipeTransaksi==="order_cash"||x.tipeTransaksi==="order_tempo";
      if(spreadsheetOrder&&!map.has(d.id))map.set(d.id,x);
    });
  }
  rows=[...map.values()];
  render();

  // Setelah order tampil, langsung cek stok dan hitung total.
  rows.forEach(r=>{
    checkStock(r.id);
    recalcOrder(r.id);
  });
}

function render(){
 const key=$("search").value.trim().toLowerCase();
 const list=rows.filter(r=>{
  const st=status(r),m=member(r);
  const okStatus=st==="menunggu_approval";
  const text=[r.nomorNota,r.nota,m.nama,m.wa,m.kode].join(" ").toLowerCase();
  return okStatus&&text.includes(key);
 });
 $("list").innerHTML=list.length?list.map(renderOrder).join(""):'<div class="card empty">Tidak ada pesanan sesuai filter.</div>';
}
function renderOrder(r){
 const m=member(r),items=normalizeItems(r),st=status(r),date=r.tanggal||today();
 const itemHtml=items.map((x,i)=>`<div class="item" data-order="${r.id}" data-index="${i}">
 <div class="item-top"><div><div class="item-name">${esc(x.nama)}</div><div class="stockline">Kode: ${esc(x.kode||"-")} • Pesanan: <b>${x.qty}</b> pcs</div></div><div id="stock_${r.id}_${i}" class="stockline">Cek stok...</div></div>
 <div class="item-grid">
  <div><div class="qty-label">CARI / GANTI PRODUK</div><input class="product-search" type="search" placeholder="Ketik nama / kode produk..."><select class="product-select">${productOptions(x.produkId)}</select></div>
  <div><div class="qty-label">QTY DISETUJUI</div><input class="approved" type="number" min="0" max="${x.qty}" value="${x.approvedQty||x.qty}"></div>
  <div><div class="qty-label">HARGA/PCS</div><input class="price" type="number" min="0" value="${x.harga||0}"></div>
</div>
<div style="margin-top:8px"><div class="qty-label">JUMLAH</div><input class="line" value="0" readonly></div>
 </div>`).join("");
 return `<div class="order" data-id="${r.id}">
 <div class="order-head"><div><div class="order-title">${esc(r.nomorNota||r.id)}</div><div style="font-size:11px;color:#64748b;margin-top:3px">${esc(date)} • ${esc(m.nama||"-")} • Kode Member: <b>${esc(m.kode||"-")}</b></div></div><span class="badge ${st}">${esc(st.replaceAll("_"," "))}</span></div>
 <div class="order-body"><div class="meta"><b>WA:</b> ${esc(m.wa||"-")}<br><b>Alamat:</b> ${esc(m.alamat||"-")}<br><b>Pembayaran:</b> ${isCash(r)?"CASH / TUNAI — LUNAS / TANPA TAGIHAN":`TEMPO ${Number(r.tempoHari||0)} hari • Jatuh tempo: ${esc(r.jatuhTempo||r.tanggalJatuhTempo||"-")}`}</div>
 <div class="items">${itemHtml}</div>
 <div class="summary" id="sum_${r.id}">Menghitung...</div>
 <div class="actions">
 ${st==="menunggu_approval"?`<button class="btn approve" onclick="approveOrder('${r.id}')">✅ Setujui & Buat Order</button><button class="btn reject" onclick="rejectOrder('${r.id}')">❌ Tolak</button>`:""}
 <button class="btn add-product" onclick="openAddProduct('${r.id}')">➕ Tambah Produk</button><button class="btn wa" onclick="sendWA('${r.id}')">📲 Kirim WA Pemesan</button>
 </div></div></div>`;
}
function recalcOrder(id){
  const card=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(!card)return;
  const r=rows.find(x=>x.id===id),cash=isCash(r);let total=0,approved=0,items=card.querySelectorAll(".item");
  items.forEach((el,i)=>{
    const q=Math.max(0,Number(el.querySelector(".approved").value)||0);
    const price=Math.max(0,Number(el.querySelector(".price").value)||0);
    const original=normalizeItems(r)[i];
    const discount=Math.min(Number(original.diskon)||0,price*q);
    const line=Math.max(0,price*q-discount);
    el.querySelector(".line").value=line;
    total+=line;approved+=q;
  });
  if(cash){$(`sum_${id}`).innerHTML=`Produk disetujui: <b>${approved} pcs</b> • Nilai barang: <b>${rp(total)}</b><br><b>💵 CASH / TUNAI — LUNAS</b><br><small>Tidak ada DP, sisa tagihan, piutang, atau jatuh tempo.</small>`;return;}
  const dp=Math.min(Number(r.dp||r.uangMuka||0),total),sisa=Math.max(0,total-dp);
  $(`sum_${id}`).innerHTML=`Produk disetujui: <b>${approved} pcs</b> • Nilai barang: <b>${rp(total)}</b><br>DP tercatat: <b>${rp(dp)}</b> • Sisa estimasi: <b>${rp(sisa)}</b><br><small>Jika produk, harga, atau qty disetujui berubah, total order akan dihitung ulang.</small>`;
}

function findSheetProduct(x){return stockCatalog.find(p=>String(p.id)===String(x.produkId))||stockCatalog.find(p=>x.kode&&String(p.kode).toLowerCase()===String(x.kode).toLowerCase())}
function checkStock(id){
 const r=rows.find(x=>x.id===id);if(!r)return;
 normalizeItems(r).forEach((x,i)=>{const p=findSheetProduct(x);if(!p){$(`stock_${id}_${i}`).innerHTML='<span class="stock-no">PRODUK TIDAK DITEMUKAN DI SPREADSHEET</span>';return}const st=Number(p.stok)||0;$(`stock_${id}_${i}`).innerHTML=`<span class="${st>=x.qty?"stock-ok":"stock-no"}">Stok Spreadsheet: ${st} • ${st>=x.qty?"TERSEDIA":"KURANG"}</span>`})
}
function filterProductSelect(input){
  const item=input.closest(".item");if(!item)return;
  const select=item.querySelector(".product-select");if(!select)return;
  const key=String(input.value||"").trim().toLowerCase();
  const current=select.value;

window.approveOrder=async id=>{
 const r=rows.find(x=>x.id===id);if(!r)return;
 const card=document.querySelector(`[data-id="${CSS.escape(id)}"]`);const original=normalizeItems(r);const approved=original.map((x,i)=>{
    const el=card.querySelectorAll(".item")[i];
    const selectedId=el.querySelector(".product-select")?.value||x.produkId;
    const p=stockCatalog.find(z=>String(z.id)===String(selectedId));
    const q=Math.max(0,Math.min(x.qty,Number(el.querySelector(".approved").value)||0));
    const harga=Math.max(0,Number(el.querySelector(".price").value)||0);
    if(p)return {...x,...p,produkId:p.id,nama:stockName(p),kode:stockCode(p),harga,modalSatuan:stockModal(p),approvedQty:q};
    return {...x,approvedQty:q,harga};
  }).filter(x=>x.approvedQty>0);
 if(!approved.length)return msg("Minimal satu produk harus disetujui.","err");
 const ref=doc(db,"penjualan",id);
 try{
  msg("Memeriksa stok dan membuat order member...");
  const result=await runTransaction(db,async tx=>{
   const fresh=await tx.get(ref);if(!fresh.exists())throw Error("Pesanan tidak ditemukan.");
   const freshData=fresh.data()||{};if(String(freshData.ownerUid||freshData.ownerId||"")!==ownerUid)throw Error("Pesanan bukan milik akun ini.");
   if(String(freshData.status||"")!=="menunggu_approval")throw Error("Pesanan sudah diproses.");
   for(const x of approved){
    const p=findSheetProduct(x);
    if(!p)throw Error(`Produk ${x.nama} tidak ditemukan di Spreadsheet Owner.`);
    const st=Number(p.stok)||0;
    if(st<x.approvedQty)throw Error(`Stok ${x.nama} hanya ${st}, disetujui ${x.approvedQty}.`);
   }
   const total=approved.reduce((a,x)=>a+(x.harga*x.approvedQty-Math.min(x.diskon,x.harga*x.approvedQty)),0);
   const cash=String(freshData.jenisHarga||"").toLowerCase()==="cash"||String(freshData.tipeTransaksi||"").toLowerCase()==="order_cash";
   const dp=cash?total:Math.min(Number(freshData.dp||freshData.uangMuka||0),total),sisa=cash?0:Math.max(0,total-dp);
   const orderRef=doc(collection(db,"order_member"));
   const order={ownerUid,uid:ownerUid,createdBy:uid,sourcePenjualanId:id,nomorNota:freshData.nomorNota||id,tipeOrder:cash?"order_cash":"order_tempo",status:"order_member",member:freshData.pelanggan||freshData.member||{},items:approved.map(x=>({produkId:x.produkId,nama:x.nama,kode:x.kode,qty:x.approvedQty,harga:x.harga,hargaDasar:x.hargaDasar??0,hargaTempo:x.hargaTempo??0,hargaCash:x.hargaCash??0,hargaJual:x.harga,tabunganPerPcs:Number(x.tabunganPerPcs??freshData.tabunganPerPcs??freshData.tabunganMember??0)||0,upPengelolaPerPcs:Number(x.upPengelolaPerPcs??freshData.upPengelolaPerPcs??freshData.upPengelola??0)||0,diskon:Math.min(x.diskon,x.harga*x.approvedQty),modalSatuan:x.modalSatuan||0,total:x.harga*x.approvedQty-Math.min(x.diskon,x.harga*x.approvedQty)})),subtotal:total,diskon:approved.reduce((a,x)=>a+Math.min(x.diskon,x.harga*x.approvedQty),0),total,totalBayar:total,dp:cash?total:dp,uangMuka:cash?total:dp,sisa:cash?0:sisa,sisaBayar:cash?0:sisa,piutang:cash?0:sisa,pendapatan:cash?total:dp,tabunganPerPcs:Number(freshData.tabunganPerPcs??freshData.tabunganMember??0)||0,upPengelolaPerPcs:Number(freshData.upPengelolaPerPcs??freshData.upPengelola??0)||0,kasBulanan:Number(freshData.kasBulanan??freshData.uangKasBulanan??0)||0,totalTabunganMember:approved.reduce((a,x)=>a+x.approvedQty*(Number(x.tabunganPerPcs??freshData.tabunganPerPcs??freshData.tabunganMember??0)||0),0),totalUPPengelola:approved.reduce((a,x)=>a+x.approvedQty*(Number(x.upPengelolaPerPcs??freshData.upPengelolaPerPcs??freshData.upPengelola??0)||0),0),jenisHarga:cash?"cash":"tempo",tempoHari:cash?0:Number(freshData.tempoHari||0),jatuhTempo:cash?"":(freshData.jatuhTempo||freshData.tanggalJatuhTempo||""),approvedAt:serverTimestamp(),createdAt:serverTimestamp(),updatedAt:serverTimestamp(),stokDikurangi:true};
   // Firestore transaction rule: ALL reads must happen before ANY writes.
   // Read the monthly cash marker before creating/updating any document.
   const kasNominal=Number(order.kasBulanan||0)||0;
   const bulan=String(freshData.tanggal||"").slice(0,7);
   const memberUid=String(freshData.memberUid||freshData.member?.uid||freshData.member?.memberUid||"");
   const kasRef=(kasNominal&&bulan&&memberUid)
     ? doc(db,"saldo_owner_kas_bulanan",ownerUid+"_"+memberUid+"_"+bulan) : null;
   const kasSnap=kasRef?await tx.get(kasRef):null;

   // Finance is posted ONLY after approval. This keeps saldo and laporan
   // sourced from the same approved order.
   const saldoRef=doc(db,"saldo_owner",ownerUid);
   const upNominal=Number(order.totalUPPengelola||0)||0;
   const saldoPatch={updatedAt:serverTimestamp()};
   if(upNominal)saldoPatch.saldoPengelola=increment(upNominal);
   if(kasRef && kasSnap && !kasSnap.exists()){
     saldoPatch.saldoKas=increment(kasNominal);
   }

   // From this point onward there are writes only.
   for(const c of changes)tx.update(c.ref,{sisa:c.baru,stok:c.baru,status:c.baru>0?"tersedia":"kosong",updatedAt:serverTimestamp()});
   tx.set(orderRef,order);
   if(kasRef && kasSnap && !kasSnap.exists()){
     tx.set(kasRef,{ownerUid,memberUid,bulan,nominal:kasNominal,sumber:"approval-order-member",orderMemberId:orderRef.id,sourcePenjualanId:id,createdAt:serverTimestamp()});
   }
   if(Object.keys(saldoPatch).length>1)tx.set(saldoRef,saldoPatch,{merge:true});

   tx.update(ref,{status:"approved",approvalStatus:"approved",approvedAt:serverTimestamp(),approvedBy:uid,approvedItems:order.items,approvedTotal:total,approvedDp:dp,approvedSisa:sisa,approvedPiutang:sisa,approvedPendapatan:cash?total:0,orderMemberId:orderRef.id,updatedAt:serverTimestamp()});
   return{orderId:orderRef.id,order};
  });
  msg("Pesanan yang disetujui sudah masuk Data Order Member. Stok Spreadsheet tidak diubah otomatis.","ok");
  await load();
  sendWAData(result.order,"approved");
 }catch(e){console.error(e);msg("Gagal approval: "+e.message,"err")}
};

function buildMessage(r,items,statusText){
 const m=member(r),nama=profile.namaKonter||profile.namaToko||"FIXZY",nota=r.nomorNota||r.id;
 let text=`Halo Kak ${m.nama||""} 👋\n\n`;
 if(statusText==="approved"){text+=`Pesanan *${nota}* sudah kami cek.\n\n`;text+=`✅ Produk yang tersedia dan disetujui:\n`;items.forEach(x=>text+=`• ${x.nama} x${x.qty} — ${rp(x.total||x.harga*x.qty)}\n`);text+=`\n💰 Total: ${rp(r.total)}\n`;if(isCash(r)){text+=`💵 CASH / TUNAI — LUNAS\n📌 Tagihan: Rp 0\n\n`;}else{text+=`💵 DP: ${rp(r.dp)}\n📌 Sisa: ${rp(r.sisa)}\n📅 Jatuh tempo: ${r.jatuhTempo||"-"}\n\n`;}text+=`Pesanan yang sudah disetujui akan diproses di *Data Order Member*.\n\nTerima kasih 🙏\n*${nama}*`;
 }else{text+=`Pesanan *${nota}* sudah kami cek.\n\n❌ DI BATALKAN Alasan pembatalan:
Bisa stock tidak tersedia atau terdapat permintaan pembaruan order dari member.
Pembatalan dilakukan agar data stok dan order tetap sesuai dengan kondisi terbaru.
Apabila stok tersedia kembali atau data order sudah diperbarui, produk/order dapat diproses kembali .\n\n${r.alasanApproval||""}\n\nSilakan isi kembali keranjag opder nya untuk pilihan produk pengganti.\n\nTerima kasih 🙏\n*${nama}*`;}
 return text;
}
function sendWAData(r,statusText){const m=member(r);const url=`https://wa.me/${waNum(m.wa)}?text=${encodeURIComponent(buildMessage(r,r.items||[],statusText))}`;window.open(url,"_blank")}
window.sendWA=id=>{
 const r=rows.find(x=>x.id===id);
 if(!r)return;

 const st=status(r);

 if(st==="menunggu_approval"){
   const m=member(r);
   const nama=profile.namaKonter||profile.namaToko||"FIXZY";
   const nota=r.nomorNota||r.id;
   const items=normalizeItems(r);

   let total=0;
   let totalQty=0;

   items.forEach(x=>{
     const qty=Number(x.qty)||0;
     const harga=Number(x.harga)||0;
     const diskon=Math.min(Number(x.diskon)||0,harga*qty);
     const jumlah=(harga*qty)-diskon;

     totalQty+=qty;
     total+=jumlah;
   });

   let text=`Halo Kak ${m.nama||""} 👋\n\n`;

   text+=`📋 *KONFIRMASI PESANAN*\n`;
   text+=`━━━━━━━━━━━━━━━━━━\n`;
   text+=`🧾 No. Nota: *${nota}*\n`;
   text+=`👤 Pemesan: *${m.nama||"-"}*\n`;
   if(m.kode)text+=`🔑 Kode: *${m.kode}*\n`;
   text+=`━━━━━━━━━━━━━━━━━━\n\n`;

   text+=`📦 *RINCIAN ORDERAN*\n\n`;

   items.forEach((x,i)=>{
     const qty=Number(x.qty)||0;
     const harga=Number(x.harga)||0;
     const diskon=Math.min(Number(x.diskon)||0,harga*qty);
     const jumlah=(harga*qty)-diskon;

     text+=`${i+1}. *${x.nama}*\n`;
     text+=`   Kode: ${x.kode||"-"}\n`;
     text+=`   Qty: *${qty} pcs*\n`;
     text+=`   Harga: ${rp(harga)}/pcs\n`;

     if(diskon>0){
       text+=`   Diskon: -${rp(diskon)}\n`;
     }

     text+=`   Jumlah: *${rp(jumlah)}*\n\n`;
   });

   text+=`━━━━━━━━━━━━━━━━━━\n`;
   text+=`📊 *RINGKASAN*\n`;
   text+=`Total Produk: *${totalQty} pcs*\n`;
   text+=`💰 Total Pesanan: *${rp(total)}*\n`;
   text+=`━━━━━━━━━━━━━━━━━━\n\n`;

   text+=`⚠️ *MOHON CEK ULANG ORDERAN ANDA*\n\n`;
   text+=`Pastikan kembali:\n`;
   text+=`✅ Nama produk sudah benar\n`;
   text+=`✅ Kode produk sudah benar\n`;
   text+=`✅ Jumlah/qty sudah benar\n`;
   text+=`✅ Harga sudah benar\n`;
   text+=`✅ Total pesanan sudah benar\n\n`;

   text+=`📦 Setelah Anda memastikan pesanan sudah benar, pesanan akan kami *APPROVAL* dan selanjutnya *DITERUSKAN KE PEMASOK* untuk diproses.\n\n`;

   text+=`❗ *Jika ada kesalahan atau perubahan, segera sampaikan sebelum pesanan kami approval dan diteruskan ke pemasok.*\n\n`;

   text+=`Terima kasih 🙏\n`;
   text+=`*${nama}*`;

   const url=`https://wa.me/${waNum(m.wa)}?text=${encodeURIComponent(text)}`;
   window.open(url,"_blank");
   return;
 }

 sendWAData(r,st==="approved"?"approved":"rejected");
};
