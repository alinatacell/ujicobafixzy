/* =========================================================
   FIXZY STANDARD IDENTITY / OWNER SCOPE
   3 ROLE ONLY: superadmin, owner, karyawan
   - ownerUid = pemilik bisnis
   - createdByUid/createdByName = akun yang melakukan input
   - teknisi/karyawan dan produk wajib berasal dari ownerUid yang sama
   ========================================================= */
async function fixzyLoadCurrentIdentity(db, auth) {
  const user = auth.currentUser;
  if (!user) throw new Error("Belum login.");
  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) throw new Error("Profil akun tidak ditemukan.");
  const p = snap.data() || {};
  const role = String(p.role || "").trim().toLowerCase();
  if (!["superadmin","owner","karyawan"].includes(role)) {
    throw new Error("Role akun tidak valid. Hanya Superadmin, Owner, atau Karyawan.");
  }
  const ownerUid = role === "owner" || role === "superadmin"
    ? user.uid
    : String(p.ownerUid || p.ownerId || "").trim();
  if (!ownerUid) throw new Error("Karyawan belum memiliki ownerUid.");
  return {
    uid: user.uid,
    ownerUid,
    role,
    name: String(p.nama || p.namaPemilik || p.namaKonter || p.namaKaryawan || user.email || "").trim(),
    profile: p
  };
}

async function fixzyLoadTeknisiStandar(db, ownerUid, selectEl) {
  if (!selectEl) return [];
  const hasil = new Map();
  const qs = [
    query(collection(db, "users"), where("ownerUid", "==", ownerUid)),
    query(collection(db, "users"), where("ownerId", "==", ownerUid))
  ];
  for (const q of qs) {
    try {
      const snap = await getDocs(q);
      snap.forEach(d => {
        const x = d.data() || {};
        const role = String(x.role || "").toLowerCase();
        if (!["karyawan"].includes(role)) return;
        const actualOwner = String(x.ownerUid || x.ownerId || "").trim();
        if (actualOwner !== String(ownerUid)) return;
        hasil.set(d.id, { id: d.id, ...x });
      });
    } catch (_) {}
  }
  const rows = [...hasil.values()].sort((a,b) =>
    String(a.nama || a.namaKaryawan || a.email || a.id)
      .localeCompare(String(b.nama || b.namaKaryawan || b.email || b.id), "id")
  );
  selectEl.innerHTML = '<option value="">-- Pilih Teknisi --</option>' +
    rows.map(x => `<option value="${String(x.id).replace(/"/g,'&quot;')}">${String(x.nama || x.namaKaryawan || x.email || x.id).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</option>`).join("");
  return rows;
}

async function fixzyLoadProdukStandar(db, ownerUid, renderFn) {
  const hasil = new Map();
  const qs = [
    query(collection(db, "stok"), where("ownerUid", "==", ownerUid)),
    query(collection(db, "stok"), where("ownerId", "==", ownerUid)),
    query(collection(db, "stok"), where("businessUid", "==", ownerUid))
  ];
  for (const q of qs) {
    try {
      const snap = await getDocs(q);
      snap.forEach(d => {
        const x = d.data() || {};
        const owners = [x.ownerUid, x.ownerId, x.businessUid].map(v => String(v || "").trim()).filter(Boolean);
        if (!owners.includes(String(ownerUid))) return;
        hasil.set(d.id, { id: d.id, ...x });
      });
    } catch (_) {}
  }
  const rows = [...hasil.values()];
  if (typeof renderFn === "function") renderFn(rows);
  return rows;
}

async function fixzyLoadTechnicians(ownerUid, selectEl) {

function fixzyValidateOwnerWrite(payload, identity) {
  if (!identity) throw new Error("Identitas akun belum siap.");
  const p=payload||{};
  if (p.ownerUid && String(p.ownerUid)!==String(identity.ownerUid))
    throw new Error("Data Owner tidak sesuai akun aktif.");
  p.ownerUid=identity.ownerUid;
  p.createdByUid=p.createdByUid||identity.uid;
  p.createdByName=p.createdByName||identity.name;
  p.createdByRole=p.createdByRole||identity.role;
  return p;
}

async function ambilProfile(){
  if(!uid)return;

  profile={};
  try{
    const s=await getDoc(doc(db,"users",uid));
    if(s.exists())profile=s.data()||{};
  }catch(e){console.warn("Profil:",e.message)}

  ownerUid=profile.ownerUid||profile.ownerId||uid;

  // Nama konter dari register Firebase.
  // Prioritas: profil login -> profil owner -> cari berdasarkan email.
  namaKonter=String(
    profile.namaKonter||profile.konterName||profile.namaToko||
    profile.namaUsaha||profile.toko||profile.konter||""
  ).trim();

  if(!namaKonter && ownerUid!==uid){
    try{
      const s=await getDoc(doc(db,"users",ownerUid));
      if(s.exists()){
        const p=s.data()||{};
        namaKonter=String(
          p.namaKonter||p.konterName||p.namaToko||p.namaUsaha||
          p.toko||p.konter||""
        ).trim();
      }
    }catch(e){}
  }

  if(!namaKonter && auth.currentUser?.email){
    try{
      const s=await getDocs(
        query(collection(db,"users"),where("email","==",auth.currentUser.email))
      );
      if(!s.empty){
        const p=s.docs[0].data()||{};
        namaKonter=String(
          p.namaKonter||p.konterName||p.namaToko||p.namaUsaha||
          p.toko||p.konter||""
        ).trim();
      }
    }catch(e){}
  }

  $("konterNameHeader").textContent=namaKonter||"Nama Konter";
  $("ownerName").textContent=
    profile.nama||profile.namaPemilik||profile.namaLengkap||
    auth.currentUser?.displayName||"Akun FIXZY";
  $("ownerEmail").textContent=auth.currentUser?.email||"Firebase";
}

async function ambilKaryawan(){
  employees=[];

  // Utamakan users karena akun karyawan FIXZY menyimpan upah/role di users.
  try{
    const s=await getDocs(collection(db,"users"));
    employees=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>{
      const r=String(x.role||"").toLowerCase();
      const st=String(x.status||"aktif").toLowerCase();
      const isWorker=["karyawan","teknisi"].includes(r);
      const belongs=x.ownerUid===ownerUid || x.id===uid || x.uid===ownerUid;
      return isWorker && st!=="nonaktif" && (belongs || ownerUid===uid);
    });
  }catch(e){
    console.warn("users karyawan:",e.message);
  }

  // Fallback koleksi karyawan lama bila users kosong.
  if(!employees.length){
    try{
      const s=await getDocs(query(collection(db,"karyawan"),where("ownerUid","==",businessUid)));
      employees=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>{
        const st=String(x.status||"aktif").toLowerCase();
        return st!=="nonaktif";
      });
    }catch(e){
      console.warn("karyawan:",e.message);
    }
  }

  const select=$("karyawan");
  select.innerHTML='<option value="">Pilih karyawan</option>';

  employees
    .sort((a,b)=>String(a.nama||a.namaKaryawan||"").localeCompare(String(b.nama||b.namaKaryawan||"")))
    .forEach(e=>{
      const n=String(e.nama||e.namaKaryawan||e.namaLengkap||e.name||e.email||"").trim();
      if(!n)return;
      const op=document.createElement("option");
      op.value=e.id||e.uid||"";
      op.textContent=n;
      op.dataset.name=n;
      op.dataset.uid=e.uid||e.id||"";
      select.appendChild(op);
    });
}

async function ambilData(){
  rows=[];

  /*
    Data pengeluaran disimpan dengan ownerUid dan uid.
    Saat membaca, coba ownerUid terlebih dahulu agar data satu konter
    tetap terbaca ketika halaman dibuka oleh akun karyawan/reseller.
  */
  const map=new Map();

  for(const field of ["ownerUid","uid"]){
    const value=field==="ownerUid"?ownerUid:uid;
    if(!value)continue;
    try{
      const s=await getDocs(
        query(collection(db,"pengeluaran"),where(field,"==",value))
      );
      s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){
      console.warn("pengeluaran",field,e.message);
    }
  }

  rows=[...map.values()];
}

function render(){
  const period=$("filterBulan").value||monthNow();

  const data=rows
    .filter(r=>String(r.tanggal||"").startsWith(period))
    .sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));

  const total=data.reduce((s,r)=>s+(Number(r.nominal)||0),0);
  const kasbon=data
    .filter(r=>String(r.jenis||"").toLowerCase()==="kasbon karyawan")
    .reduce((s,r)=>s+(Number(r.nominal)||0),0);

  $("total").textContent=money(total);
  $("kasbon").textContent=money(kasbon);
  $("lain").textContent=money(total-kasbon);
  $("jumlah").textContent=data.length;

  $("tbody").innerHTML=data.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${esc(r.tanggal||"-")}</td>
      <td><span class="badge">${esc(r.jenis||"-")}</span></td>
      <td>${esc(r.namaKaryawan||"-")}</td>
      <td>${esc(r.keterangan||"-")}</td>
      <td class="num amount">${money(r.nominal)}</td>
    </tr>
  `).join("") ||
  '<tr><td colspan="6" class="empty">Belum ada pengeluaran pada bulan ini.</td></tr>';
}

async function simpan(){
  if(!uid){
    showPopup("Sesi Firebase belum tersedia",
      "Halaman belum menemukan akun FIXZY yang aktif. Buka halaman dari aplikasi FIXZY yang sudah login.");
    return;
  }

  const tanggal=$("tanggal").value||today();
  const jenis=$("jenis").value;
  const nominal=Number($("nominal").value||0);
  const keterangan=$("keterangan").value.trim();

  if(!nominal||nominal<1){
    showPopup("Nominal belum diisi","Masukkan nominal pengeluaran terlebih dahulu.");
    return;
  }

  let karyawanId="";
  let namaKaryawan="";
  let karyawanUid="";

  if(jenis==="Kasbon Karyawan"){
    const op=$("karyawan").selectedOptions[0];
    karyawanId=$("karyawan").value;
    namaKaryawan=op?.dataset?.name||op?.textContent||"";
    karyawanUid=op?.dataset?.uid||"";

    if(!karyawanId){
      showPopup("Karyawan belum dipilih","Pilih karyawan untuk transaksi kasbon.");
      return;
    }
  }

  try{
    $("status").textContent="⏳ Menyimpan pengeluaran ke Firebase...";

    await addDoc(collection(db,"pengeluaran"),{
      uid,
      ownerUid,
      email:auth.currentUser?.email||"",
      namaKonter:namaKonter||"",
      tanggal,
      jenis,
      nominal,
      keterangan,
      karyawanId,
      karyawanUid,
      namaKaryawan,
      createdBy:auth.currentUser?.uid||uid,
      createdAt:serverTimestamp()
    });

    bersihkan();
    await ambilData();
    render();

    $("status").innerHTML=
      `<span class="ok">✓ Pengeluaran berhasil disimpan ke Firebase • ${esc(jenis)} • ${money(nominal)}</span>`;
    showPopup("Berhasil disimpan",
      `Data pengeluaran ${jenis} sebesar ${money(nominal)} sudah tersimpan di Firebase.`);
  }catch(e){
    console.error(e);
    $("status").innerHTML=
      `<span class="err">❌ Gagal menyimpan: ${esc(e.message||e)}</span>`;
    showPopup("Gagal menyimpan",e.message||String(e));
  }
}
window.simpan=simpan;

async function muatSemua(){
  $("status").textContent="⏳ Memuat data Firebase...";
  try{
    await ambilProfile();
    await ambilKaryawan();
    await ambilData();
    render();

    $("status").innerHTML=
      `<span class="ok">✓ Firebase aktif • ${rows.length} data pengeluaran • ${employees.length} karyawan • ${esc(namaKonter||"Nama Konter")}</span>`;
  }catch(e){
    console.error(e);
    $("status").innerHTML=
      `<span class="err">❌ Gagal memuat Firebase: ${esc(e.message||e)}</span>`;
  }
}
window.muatSemua=muatSemua;

$("tanggal").value=today();
$("filterBulan").value=monthNow();
ubahJenis();

onAuthStateChanged(auth,async user=>{
  if(!user){
    uid="";
    $("ownerName").textContent="Menunggu sesi FIXZY...";
    $("ownerEmail").textContent="";
    $("status").innerHTML=
      '<span class="err">⚠️ Sesi Firebase belum terbaca.</span><br>'+
      '<span class="status">Tidak ada pengalihan otomatis ke login. Buka halaman ini dari index FIXZY yang sudah login.</span>';
    return;
  }

  uid=user.uid;
  await muatSemua();
});

/* FIXZY ACCESS STANDARD v2026-08
   Canonical identity:
   superadmin -> own uid
   owner -> own uid
   karyawan -> ownerUid from own users profile
   Every business write must carry ownerUid + createdByUid + createdByName + createdByRole.
*/
function fixzyIdentityStandard(){
  const s=window.fixzySession||{};
  const p=s.profile||{};
  const role=String(s.role||p.role||"").toLowerCase();
  if(!["superadmin","owner","karyawan"].includes(role)) throw new Error("Role akun tidak valid.");
  const ownerUid=role==="karyawan"?String(s.ownerUid||p.ownerUid||p.ownerId||""):String(s.uid||p.uid||"");
  if(!ownerUid) throw new Error("ownerUid tidak ditemukan.");
  const createdByUid=String(s.uid||"");
  const createdByName=String(p.nama||p.namaTeknisi||p.namaKaryawan||p.namaPemilik||p.namaKonter||p.email||"");
  return {ownerUid,createdByUid,createdByName,createdByRole:role};
}
