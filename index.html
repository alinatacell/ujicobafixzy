<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Promo A Yudi Thea</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#slider{width:100vw;height:100vh;position:relative;background:#000}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s ease}
img.active{opacity:1}
</style>
</head>
<body>
<div id="slider">
  <img src="promo1.png" class="active">
  <img src="promo2.png">
  <img src="promo3.jpg">
  <img src="promo4.png">
  <img src="promo5.png">
</div>
<script>
const slides=[...document.querySelectorAll('#slider img')];
let i=0;
setInterval(()=>{
  slides[i].classList.remove('active');
  i=(i+1)%slides.length;
  slides[i].classList.add('active');
},5000);
</script>
</body>
</html>
